{% extends "base.html" %}
{% block title %}즐겨찾기{% endblock %}
{% block content %}
{% set detail_qs = '?from=favorites' %}
<div class="page-head">
  <h1>내 즐겨찾기</h1>
  <p class="subtitle">저장해둔 장소 목록입니다.</p>
</div>
{% if places %}
<div class="grid">
  {% for item in places %}{% include "_place_card.html" %}{% endfor %}
</div>
{% else %}
<div class="panel">즐겨찾기한 장소가 없습니다. <a href="/places">장소 둘러보기</a></div>
{% endif %}
{% endblock %}
