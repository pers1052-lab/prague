{% extends "base.html" %}
{% block title %}문의하기{% endblock %}
{% block content %}
<div class="narrow">
  <div class="page-head">
    <h1>문의하기</h1>
    <p class="subtitle">궁금하신 점을 남겨주시면 이메일로 빠르게 답변드립니다.</p>
  </div>
  <div class="panel">
    <form class="stack" method="post" action="/inquiry">
      <div>
        <label for="name">이름</label>
        <input id="name" type="text" name="name" required value="{{ user.nickname if user else '' }}">
      </div>
      <div>
        <label for="email">이메일 (회신 받으실 주소)</label>
        <input id="email" type="email" name="email" required value="{{ user.email if user else '' }}">
      </div>
      <div>
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" required placeholder="궁금한 점을 자유롭게 남겨주세요"></textarea>
      </div>
      <button class="btn" type="submit">문의 보내기</button>
    </form>
  </div>
</div>
{% endblock %}
