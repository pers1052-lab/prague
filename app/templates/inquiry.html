{% extends "base.html" %}
{% block title %}문의하기{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
  <h1>문의하기</h1>
  <p class="subtitle">궁금하신 점을 남겨주시면 이메일로 빠르게 답변드립니다.</p>
  <form class="stack" method="post" action="/inquiry">
    <div>
      <label>이름</label>
      <input type="text" name="name" required value="{{ user.nickname if user else '' }}">
    </div>
    <div>
      <label>이메일 (회신 받으실 주소)</label>
      <input type="email" name="email" required value="{{ user.email if user else '' }}">
    </div>
    <div>
      <label>문의 내용</label>
      <textarea name="message" required placeholder="궁금한 점을 자유롭게 남겨주세요"></textarea>
    </div>
    <button class="btn" type="submit">문의 보내기</button>
  </form>
</div>
{% endblock %}
