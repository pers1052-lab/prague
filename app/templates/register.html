{% extends "base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="card" style="max-width:480px; margin:0 auto;">
  <h1>회원가입</h1>
  <form class="stack" method="post" action="/register">
    <div>
      <label>닉네임</label>
      <input type="text" name="nickname" required maxlength="30">
    </div>
    <div>
      <label>이메일</label>
      <input type="email" name="email" required>
    </div>
    <div>
      <label>비밀번호 (6자 이상)</label>
      <input type="password" name="password" required minlength="6">
    </div>
    <button class="btn" type="submit">가입하기</button>
  </form>
  <p style="margin-top:16px; font-size:0.9rem; color:var(--ink-soft);">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
</div>
{% endblock %}
