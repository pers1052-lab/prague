<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}프라하 가족여행 가이드{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">프라하 가족여행</a>
    <nav class="main-nav">
      <a href="/journal" class="{{ 'active' if active=='journal' else '' }}">여행일지</a>
      <a href="/places" class="{{ 'active' if active=='places' else '' }}">장소공유</a>
      <a href="/transit" class="{{ 'active' if active=='transit' else '' }}">교통정보</a>
      <a href="/inquiry" class="{{ 'active' if active=='inquiry' else '' }}">문의하기</a>
      {% if user %}
        <a href="/favorites" class="{{ 'active' if active=='favorites' else '' }}">즐겨찾기</a>
        <span style="color:var(--ink-soft)">{{ user.nickname }}님</span>
        <a href="/logout">로그아웃</a>
      {% else %}
        <a href="/login" class="{{ 'active' if active=='login' else '' }}">로그인</a>
        <a href="/register" class="btn" style="padding:6px 14px;">회원가입</a>
      {% endif %}
    </nav>
  </div>
</header>
<div class="container">
  {% if flash %}
    <div class="flash {{ flash_type or 'ok' }}">{{ flash }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
<footer>© 2026 프라하 가족여행 가이드 · 문의: pers1052@gmail.com</footer>
</body>
</html>
