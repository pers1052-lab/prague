{% extends "base.html" %}
{% block title %}장소 등록{% endblock %}
{% block content %}
<div class="narrow">
  <div class="page-head">
    <h1>새 장소 등록</h1>
    <p class="subtitle">추천하고 싶은 프라하의 장소를 알려주세요.</p>
  </div>
  <div class="panel">
    <form class="stack" method="post" action="/places/new" enctype="multipart/form-data">
      <div>
        <label for="name">장소 이름</label>
        <input id="name" type="text" name="name" required maxlength="80">
      </div>
      <div>
        <label for="category">카테고리</label>
        <select id="category" name="category">
          {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div class="row-2">
        <div>
          <label for="lat">위도 (latitude)</label>
          <input id="lat" type="text" name="lat" required placeholder="예: 50.0875">
        </div>
        <div>
          <label for="lng">경도 (longitude)</label>
          <input id="lng" type="text" name="lng" required placeholder="예: 14.4213">
        </div>
      </div>
      <p class="hint">구글맵에서 장소를 검색 후 우클릭하면 좌표를 복사할 수 있습니다.</p>
      <div>
        <label for="description">설명</label>
        <textarea id="description" name="description" placeholder="추천 이유, 팁 등을 적어주세요"></textarea>
      </div>
      <div>
        <label for="photo">사진 (선택)</label>
        <input id="photo" type="file" name="photo" accept="image/*">
      </div>
      <button class="btn" type="submit">등록하기</button>
    </form>
  </div>
</div>
{% endblock %}
