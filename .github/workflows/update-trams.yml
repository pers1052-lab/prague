# PID 공식 GTFS를 받아 트램 노선 데이터(app/static/data/trams.json)를 갱신합니다.
# 매주 월요일 자동 실행되며, Actions 탭에서 "Run workflow"로 바로 실행할 수도 있습니다.
name: Update Prague tram routes

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - scripts/build_trams.py
      - .github/workflows/update-trams.yml

permissions:
  contents: write

concurrency:
  group: update-trams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download PID GTFS
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/PID_GTFS.zip" https://data.pid.cz/PID_GTFS.zip

      - name: Build tram routes
        run: |
          mkdir -p app/static/data
          python scripts/build_trams.py "$RUNNER_TEMP/PID_GTFS.zip" app/static/data/trams.json
          ls -l app/static/data/trams.json

      - name: Commit if changed
        run: |
          git add app/static/data/trams.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Prague tram routes from PID GTFS"
          git push origin "HEAD:${GITHUB_REF_NAME}"
